const KEY='speak-emirati-60-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={completed:{},xp:0,seen:{}};
try{let v=JSON.parse(localStorage.getItem(KEY)||'{}');if(v&&typeof v==='object')state={completed:v.completed||{},xp:Number(v.xp)||0,seen:v.seen||{}}}catch(e){}
let current=0,idx=0,selected='',assembled=[],checked=false,correct=0,finished=false,intro=true,revealed='',earned=0,questions=[],seenOnScreen=new Set();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function lesson(){return DATA.lessons[current]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildOrder(q){let vocab=shuffle(q.filter(x=>x.type==='choice'&&(/What does|mean\?|Choose a natural|Pick the|Which means|How do you say/.test(x.prompt))));let others=shuffle(q.filter(x=>!vocab.includes(x)));let first=vocab.splice(0,Math.min(3,vocab.length));let result=first;while(vocab.length||others.length){if(others.length)result.push(others.shift());if(vocab.length&&Math.random()<.75)result.push(vocab.shift());if(others.length&&Math.random()<.55)result.push(others.shift());}return result}
function nav(to){let levels=to==='levels';$('picker').classList.toggle('hidden',!levels);$('practiceArea').classList.toggle('hidden',levels);$('levelsTab').classList.toggle('active',levels);$('practiceTab').classList.toggle('active',!levels);if(levels)sidebar();window.scrollTo({top:0,behavior:'instant'})}
function sidebar(){let done=DATA.lessons.filter(l=>state.completed[l.id]).length;$('doneCount').textContent=`${done}/${DATA.lessons.length} completed`;$('xp').textContent=`✦ ${state.xp} XP`;
$('lessonList').innerHTML=DATA.lessons.map((l,i)=>`${i%6===0?'<div class="unitlabel">UNIT '+String(Math.floor(i/6)+1).padStart(2,'0')+' · '+esc(DATA.unitTitles[Math.floor(i/6)])+'</div>':''}<button type="button" class="lessonbtn ${current===i?'active':''} ${state.completed[l.id]?'done':''}" data-lesson="${i}"><span class="num">${state.completed[l.id]?'✓':i+1}</span><span><strong>${esc(l.title)}</strong><div class="small">${l.questions.length} questions · ${state.completed[l.id]?'Completed / replay':'Preview unlocked'}</div></span></button>`).join('');document.querySelectorAll('[data-lesson]').forEach(b=>b.addEventListener('click',()=>start(+b.dataset.lesson)));$('lessonLabel').textContent=`Unit ${Math.floor(current/6)+1} · Lesson ${current+1} · ${lesson().title}`}
function start(i){if(i<0||i>=DATA.lessons.length)return;current=i;idx=0;selected='';assembled=[];checked=false;correct=0;earned=0;finished=false;intro=true;revealed='';questions=buildOrder(lesson().questions).map(q=>({...q,options:shuffle(q.options)}));seenOnScreen=new Set();sidebar();nav('practice');render()}
function vocabFor(s){let clean=s.replace(/^[^\u0600-\u06ff]+|[^\u0600-\u06ff]+$/g,'');return lesson().vocabulary.find(x=>x.ar===clean)||null}
function wordMarkup(s){return String(s).split(/(\s+)/).map(part=>{if(!part.trim())return esc(part);let v=vocabFor(part);if(!v||state.seen[v.ar])return esc(part);return `<button type="button" class="word" data-word="${esc(v.ar)}">${esc(part)}</button>`}).join('')}
function markEncountered(q){if(q.type==='listen')return;let combined=String(q.prompt)+' '+String(q.answer);for(const v of lesson().vocabulary){if(combined.includes(v.ar))state.seen[v.ar]=true;}save()}
function markEncountered(q){if(!q)return;for(const v of lesson().vocabulary){if((q.prompt+' '+(q.answer||'')).includes(v.ar))state.seen[v.ar]=true;}save()}
function bindWords(){document.querySelectorAll('[data-word]').forEach(b=>b.addEventListener('click',()=>{let a=b.dataset.word,v=lesson().vocabulary.find(x=>x.ar===a);if(!v)return;state.seen[a]=true;save();revealed=`<div class="meaning" role="status"><strong lang="ar" dir="rtl" style="font-size:24px">${esc(a)}</strong><br>${esc(v.meaning)}</div>`;if($('meaningBox'))$('meaningBox').innerHTML=revealed;b.classList.add('seen');b.disabled=true}))}
function render(){let l=lesson();if(finished){let newly=!state.completed[l.id];if(newly){state.completed[l.id]=true;state.xp+=earned;save()}sidebar();$('panel').innerHTML=`<div class="summary"><div class="eyebrow">LESSON COMPLETE</div><h2>${esc(l.title)}</h2><div class="score">${correct}/${questions.length}</div><p>${newly?`+${earned} XP earned`:'Replay completed — XP preserved'}</p><p class="note">Listen & Build has no recordings yet; your guesses are scored normally.</p><div class="actions" style="justify-content:center"><button class="secondary" id="replay">Replay</button>${current<DATA.lessons.length-1?'<button class="primary" id="nextLesson">Next lesson →</button>':''}</div></div>`;$('replay').onclick=()=>start(current);if($('nextLesson'))$('nextLesson').onclick=()=>start(current+1);return}
if(intro){$('panel').innerHTML=`<div class="intro"><div class="eyebrow">LESSON ${current+1} · ${questions.length} QUESTIONS</div><h2>${esc(l.title)}</h2><p>Start with familiar words, then practise short expressions and build longer sentences. Question types are mixed each time you replay.</p><p class="hint">🟨 New vocabulary is highlighted the first time it appears. Tap to reveal its meaning. Audio questions are guessing challenges for now.</p><div class="actions"><button class="primary" id="begin">Start practice →</button><button class="secondary" id="openLevels">Browse lessons</button></div></div>`;$('begin').onclick=()=>{intro=false;render()};$('openLevels').onclick=()=>nav('levels');return}
let q=questions[idx],tiles=q.type==='tiles'||q.type==='listen',listen=q.type==='listen',opts=tiles?q.options.map((v,i)=>({v,i})).filter(x=>!assembled.some(a=>a.i===x.i)):q.options.map((v,i)=>({v,i}));
$('panel').innerHTML=`<div class="row"><span class="qtype">LESSON ${current+1} · ${esc(l.title)}</span><span class="note">${idx+1} / ${questions.length}</span></div><div class="progress"><div class="fill" style="width:${idx/questions.length*100}%"></div></div><div class="qtype">${listen?'🎧 LISTEN & BUILD · AUDIO PENDING':tiles?'🧩 BUILD ARABIC':'VOCABULARY PRACTICE'}</div><div class="question">${listen?'Build the sentence you would hear':wordMarkup(q.prompt)}</div>${listen?`<div class="audioBox"><strong>🔇 Audio coming soon</strong><div class="mini">The Arabic sentence stays hidden until you check your answer. Guess the order for now 😄</div><button type="button" class="secondary" id="playAudio" ${q.audioSrc?'':'disabled title="Recording not connected"'}>▶ ${q.audioSrc?'Play audio':'Play audio (unavailable)'}</button><div class="mini" id="audioStatus" aria-live="polite"></div></div>`:''}<div id="meaningBox">${revealed}</div>${tiles?`<div class="answer" lang="ar" dir="rtl">${assembled.map((x,j)=>`<button type="button" data-remove="${j}">${esc(x.v)}</button>`).join('')||'<span class="note">Tap words in the correct order</span>'}</div>`:''}<div class="choices">${opts.map(x=>`<button type="button" class="opt ${!tiles&&selected===x.v?'selected':''} ${/[\u0600-\u06ff]/.test(x.v)?'arabic':''}" data-choice="${x.i}" ${checked?'disabled':''}>${esc(x.v)}</button>`).join('')}</div>${checked?`<div class="feedback ${selected===q.answer?'good':'bad'}"><strong>${selected===q.answer?'Correct! 🎉':'Not quite.'}</strong><br>${selected!==q.answer?'Correct answer: '+esc(q.answer)+'<br>':''}${esc(q.explanation)}</div>`:''}<div class="actions"><button type="button" class="secondary" id="restart">Restart lesson</button><button type="button" class="primary" id="action" ${!checked&&!selected?'disabled':''}>${checked?(idx===questions.length-1?'Finish lesson':'Continue →'):'Check answer'}</button></div>`;
bindWords();if(listen&&$('playAudio')&&q.audioSrc){$('playAudio').onclick=()=>{const a=new Audio(q.audioSrc);$('audioStatus').textContent='Playing…';a.play().catch(()=>{$('audioStatus').textContent='Could not play recording. Check the file path.'});a.onended=()=>{$('audioStatus').textContent='Playback finished.'};a.onerror=()=>{$('audioStatus').textContent='Audio file missing or unreadable.'}}}$('restart').onclick=()=>start(current);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(checked)return;let i=+b.dataset.choice;if(tiles){assembled.push({v:q.options[i],i});selected=assembled.map(x=>x.v).join(' ')}else selected=q.options[i];render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(checked)return;assembled.splice(+b.dataset.remove,1);selected=assembled.map(x=>x.v).join(' ');render()});$('action').onclick=()=>{if(!checked){if(!selected)return;checked=true;if(selected===q.answer){correct++;earned+=10}render()}else{markEncountered(q);markEncountered(questions[idx]);idx++;checked=false;selected='';assembled=[];revealed='';if(idx===questions.length)finished=true;render()}};
}
$('levelsTab').onclick=()=>nav('levels');$('practiceTab').onclick=()=>nav('practice');$('closePicker').onclick=()=>nav('practice');$('reset').onclick=()=>{if(confirm('Clear XP, completed lessons and vocabulary history?')){state={completed:{},xp:0,seen:{}};save();start(0)}};start(0);
</script></body></html>
