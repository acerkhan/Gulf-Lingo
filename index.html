function audioNormalize(t){return String(t||'').normalize('NFC').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[،؛؟!?.,:]+/g,' ').replace(/\s+/g,' ').trim()}
const AUDIO_LOOKUP=new Map();
for(const [text,path] of Object.entries(AUDIO_LIBRARY)){const k=audioNormalize(text);if(!AUDIO_LOOKUP.has(k))AUDIO_LOOKUP.set(k,path)}
function audioPath(text){return AUDIO_LIBRARY[text]||AUDIO_LOOKUP.get(audioNormalize(text))||null}
let playingAudio=null;
function playArabic(text,button){const src=audioPath(text);if(!src)return false;if(playingAudio){playingAudio.pause();playingAudio=null}const a=new Audio(src);a.volume=0.55;playingAudio=a;if(button)button.disabled=true;const done=()=>{if(button)button.disabled=false;if(playingAudio===a)playingAudio=null};a.onended=done;a.onerror=()=>{done();console.warn('Missing audio:',src)};a.play().catch(err=>{done();console.warn('Audio playback failed:',err)});return true}
// Play the selected Arabic option first; answer feedback waits until it finishes.
let selectionAudio=null;
function pronounceSelection(text){
  const src=audioPath(text);
  if(!src)return Promise.resolve(false);
  if(selectionAudio){selectionAudio.pause();selectionAudio=null}
  if(playingAudio){playingAudio.pause();playingAudio=null}
  const a=new Audio(src);a.volume=0.55;selectionAudio=a;
  return new Promise(resolve=>{
    let settled=false;
    const done=(ok)=>{if(settled)return;settled=true;if(selectionAudio===a)selectionAudio=null;resolve(ok)};
    a.onended=()=>done(true);
    a.onerror=()=>done(false);
    a.play().catch(()=>done(false));
  });
}
let answerFeedbackToken=0;
async function feedbackAfterPronunciation(correctAnswer){
  const token=++answerFeedbackToken;
  if(selectionAudio){
    const a=selectionAudio;
    await new Promise(resolve=>{if(a.ended||a.paused)return resolve();a.addEventListener('ended',resolve,{once:true});a.addEventListener('error',resolve,{once:true});setTimeout(resolve,6500)});
  }
  if(token===answerFeedbackToken)soundFeedback(correctAnswer);
}

function audioContext(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!soundContext)soundContext=new C();if(soundContext.state==='suspended')soundContext.resume();return soundContext}catch(e){return null}}
function tone(freq,start,duration,volume,type='sine'){
 const c=audioContext();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,c.currentTime+start);o.connect(g);g.connect(c.destination);const t=c.currentTime+start;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,volume*SFX_VOLUME),t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.start(t);o.stop(t+duration+.01);

function saveSession(){try{localStorage.setItem(SESSION_KEY,JSON.stringify({lessonId:lesson().id,idx,selected,assembled,checked,correct,finished,intro,revealed,earned,questions,reviewIndex,reviewCorrect,reviewChoice,updatedAt:Date.now()}))}catch(e){}}
function clearSession(){try{localStorage.removeItem(SESSION_KEY)}catch(e){}}
function exportProgress(){save();saveSession();const payload={format:'gulf-lingo-progress',version:1,exportedAt:new Date().toISOString(),state,session:JSON.parse(localStorage.getItem(SESSION_KEY)||'null')};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='gulf-lingo-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function importProgress(file){if(!file)return;let payload;try{payload=JSON.parse(await file.text())}catch(e){alert('Invalid JSON file.');return}if(payload?.format!=='gulf-lingo-progress'||payload.version!==1||!payload.state||typeof payload.state!=='object'||typeof payload.state.completed!=='object'||typeof payload.state.seen!=='object'||!Number.isFinite(Number(payload.state.xp))){alert('Not a valid Gulf Lingo progress backup.');return}if(!confirm('Replace progress on this browser with the imported backup?'))return;state={completed:payload.state.completed,xp:Math.max(0,Number(payload.state.xp)),seen:payload.state.seen};save();if(payload.session&&typeof payload.session==='object'){localStorage.setItem(SESSION_KEY,JSON.stringify(payload.session))}else clearSession();location.reload()}
function restoreSession(){try{const v=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');if(!v||!Array.isArray(v.questions))return false;const i=DATA.lessons.findIndex(l=>l.id===v.lessonId);if(i<0||v.questions.length!==DATA.lessons[i].questions.length||!Number.isInteger(v.idx)||v.idx<0||v.idx>v.questions.length)return false;if(v.questions.some(q=>q.type==='listen' && (q.answer==='شو تبغي' || q.answer.split(' ').some(t=>q.options.filter(o=>o===t).length<q.answer.split(' ').filter(w=>w===t).length))))return false;current=i;idx=v.idx;selected=typeof v.selected==='string'?v.selected:'';assembled=Array.isArray(v.assembled)?v.assembled:[];checked=!!v.checked;correct=Number(v.correct)||0;finished=!!v.finished;intro=!!v.intro;revealed='';earned=Number(v.earned)||0;questions=v.questions;reviewIndex=Number(v.reviewIndex)||0;reviewCorrect=Number(v.reviewCorrect)||0;reviewChoice=typeof v.reviewChoice==="string"?v.reviewChoice:"";return true}catch(e){return false}}

function lesson(){return DATA.lessons[current]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildOrder(q){const reviews=q.filter(x=>x.type==='unit-review');q=q.filter(x=>x.type!=='unit-review');let vocab=shuffle(q.filter(x=>x.type==='choice'&&(/What does|mean\?|Choose a natural|Pick the|Which means|How do you say/.test(x.prompt))));let others=shuffle(q.filter(x=>!vocab.includes(x)));let first=vocab.splice(0,Math.min(3,vocab.length));let result=first;while(vocab.length||others.length){if(others.length)result.push(others.shift());if(vocab.length&&Math.random()<.75)result.push(vocab.shift());if(others.length&&Math.random()<.55)result.push(others.shift());}return result.concat(reviews)}
function nav(to){let levels=to==='levels';$('picker').classList.toggle('hidden',!levels);$('practiceArea').classList.toggle('hidden',levels);$('levelsTab').classList.toggle('active',levels);$('practiceTab').classList.toggle('active',!levels);if(levels)sidebar();window.scrollTo({top:0,behavior:'instant'})}
function sidebar(){
 const done=DATA.lessons.filter(l=>state.completed[l.id]).length;
 $('doneCount').textContent=`${done}/${DATA.lessons.length} completed`;
 $('xp').textContent=`✦ ${state.xp} XP`;
 const themes=[
 ['🧑🏻‍🤝‍🧑🏽','Start talking','Greetings, introductions and everyday questions','#16796d'],
 ['🙋🏽‍♂️','Say what you need','Wants, requests and useful expressions','#8760a7'],
 ['🏡','People & places','Family, home and daily routines','#c07842'],
 ['🕒','Make your plans','Time, appointments and invitations','#327aa2'],
 ['🛍️','Out shopping','Prices, payments and useful shopping words','#a05781'],
 ['👩🏽‍🍳','Order with confidence','Food, cafés and restaurants','#a46b32'],
 ['🚕','Find your way','Directions, transport and locations','#447c9c'],
 ['👨🏽‍💼','Handle your day','Work, tasks and practical conversations','#647b43'],
 ['💬','Speak with clarity','Explaining, asking and understanding','#8864a1'],
 ['🌆','Real conversations','Everyday Emirati conversations','#b36c52']
 ];
 $('lessonList').innerHTML=DATA.unitTitles.map((title,u)=>{
   const [art,tag,description,color]=themes[u],ls=DATA.lessons.slice(u*8,u*8+8);
   const complete=ls.filter(l=>state.completed[l.id]).length;
   return `<section class="unit-card" style="--unit-color:${color}">
      <div class="unit-hero"><div class="unit-copy"><span class="unit-eyebrow">UNIT ${String(u+1).padStart(2,'0')} · ${complete}/8 LESSONS</span><h3>${esc(title)}</h3><p>${description}</p><span class="unit-tag">${tag}</span></div><div class="unit-art" aria-hidden="true"><div class="art-halo"></div><span>${art}</span></div></div>
      <div class="unit-track"><div style="width:${complete/8*100}%"></div></div>
      <div class="lesson-grid">${ls.map((l,k)=>{const i=u*8+k,finished=!!state.completed[l.id];return `<button type="button" class="lesson-tile ${current===i?'active':''} ${finished?'done':''}" data-lesson="${i}"><span class="tile-num">${finished?'✓':i+1}</span><span class="tile-content"><strong>${esc(l.title)}</strong><small>${finished?'Completed · Replay':k===6?'🎯 Recognition challenge':k===7?'🏆 Recall challenge':'Start lesson →'}</small></span><span class="tile-arrow">↗</span></button>`}).join('')}</div>
   </section>`;
 }).join('');
 document.querySelectorAll('[data-lesson]').forEach(b=>b.addEventListener('click',()=>start(+b.dataset.lesson)));
 $('lessonLabel').textContent=`Unit ${Math.floor(current/8)+1} · Lesson ${current%8+1} · ${lesson().title}`;
}
function start(i){if(i<0||i>=DATA.lessons.length)return;current=i;idx=0;selected='';assembled=[];checked=false;correct=0;earned=0;finished=false;intro=true;revealed='';reviewIndex=0;reviewCorrect=0;reviewChoice="";questions=buildOrder(lesson().questions).map(q=>({...q,options:shuffle(q.options)}));seenOnScreen=new Set();saveSession();sidebar();nav('practice');render()}
function vocabFor(s){let clean=s.replace(/^[^\u0600-\u06ff]+|[^\u0600-\u06ff]+$/g,'');return lesson().vocabulary.find(x=>x.ar===clean)||null}
function wordMarkup(s){
 const parts=String(s).split(/(\s+)/);
 let out='',run=[];
 const flush=()=>{if(run.length){out+=`<span class="arabic-phrase" lang="ar" dir="rtl">${run.join('')}</span>`;run=[]}};
 for(let i=0;i<parts.length;i++){
   const part=parts[i];
   if(!part.trim()){
     const next=parts.slice(i+1).find(x=>x.trim());
     if(run.length&&next&&/[\u0600-\u06ff]/.test(next)){run.push(esc(part))}
     else{flush();out+=esc(part)}
     continue;
   }
   if(!/[\u0600-\u06ff]/.test(part)){flush();out+=esc(part);continue}
   const v=vocabFor(part);
   run.push(`<button type="button" lang="ar" dir="rtl" class="word ${v&&state.seen[v.ar]?'seen':''}" data-word="${esc(v?v.ar:part)}" aria-label="Hear Arabic word">${esc(part)}</button>`);
 }
 flush();return out;
}
function markEncountered(q){if(q.type==='listen')return;let combined=String(q.prompt)+' '+String(q.answer);for(const v of lesson().vocabulary){if(combined.includes(v.ar))state.seen[v.ar]=true;}save()}
function markEncountered(q){if(!q)return;for(const v of lesson().vocabulary){if((q.prompt+' '+(q.answer||'')).includes(v.ar))state.seen[v.ar]=true;}save()}
function bindWords(){document.querySelectorAll('[data-word]').forEach(b=>b.addEventListener('click',()=>{let a=b.dataset.word,v=lesson().vocabulary.find(x=>x.ar===a);tapSound();pronounceSelection(a);if(v){state.seen[a]=true;save();revealed=`<div class="meaning" role="status"><strong lang="ar" dir="rtl" style="font-size:24px">${esc(a)}</strong><br>${esc(v.meaning)}</div>`;if($('meaningBox'))$('meaningBox').innerHTML=revealed;b.classList.add('seen')}}))}
function reviewOptions(q,item){
  const answers=q.items.map(x=>q.mode==='ar-en'?x.meaning:x.ar);
  const target=q.mode==='ar-en'?item.meaning:item.ar;
  const pool=Array.from(new Set(answers.filter(x=>x!==target)));
  // Stable distractors per item, including after refresh.
  const seed=q.items.indexOf(item);let order=pool.map((v,j)=>({v,key:(j*1103515245+seed*12345+1987)>>>0})).sort((a,b)=>a.key-b.key).slice(0,3).map(x=>x.v);
  return [target,...order].sort((a,b)=>{const hash=t=>Array.from(t).reduce((n,c)=>((n*31+c.charCodeAt(0))>>>0),seed+42);return hash(a)-hash(b)});
}
function renderReview(q){
 const total=q.items.length,done=reviewIndex>=total;
 if(done){
  selected=q.answer;checked=true;
  $('panel').innerHTML=`<div class="review-done"><div class="big">🏆</div><h2>Vocabulary challenge complete!</h2><p>You tested all ${total} words in this unit.</p><p><strong>${reviewCorrect} / ${total} correct</strong></p><p class="note">${q.mode==='ar-en'?'Arabic → English':'English → Arabic'} · progress saved</p><div class="actions" style="justify-content:center"><button class="primary" id="reviewNext">${idx===questions.length-1?'Finish lesson':'Continue →'}</button></div></div>`;
  $('reviewNext').onclick=()=>{correct++;earned+=10;idx++;checked=false;selected='';assembled=[];reviewIndex=0;reviewCorrect=0;reviewChoice='';if(idx===questions.length)finished=true;render()};saveSession();return;
 }
 const item=q.items[reviewIndex],arabic=q.mode==='ar-en',target=arabic?item.meaning:item.ar;
 const opts=reviewOptions(q,item);
 $('panel').innerHTML=`<div class="qtype">🏅 UNIT PRACTICE · ${arabic?'RECOGNITION':'RECALL'}</div><div class="review-head"><span>${arabic?'Arabic → English':'English → Arabic'}</span><span>${reviewIndex+1} / ${total} words</span></div><div class="progress"><div class="fill" style="width:${100*reviewIndex/total}%"></div></div><div class="review-prompt" ${arabic?'lang="ar" dir="rtl"':''}>${arabic?`<button type="button" class="review-word" data-audio-text="${esc(item.ar)}">${esc(item.ar)}</button>`:esc(item.meaning)}</div>${arabic?audioButton(item.ar,'🔊 Hear word'):''}<div class="choices">${opts.map((o,j)=>`<button class="opt ${reviewChoice===o?'selected':''} ${!arabic?'arabic':''}" data-review="${j}" ${reviewChoice?'disabled':''}>${esc(o)}</button>`).join('')}</div><div id="reviewFeedback" class="feedback ${reviewChoice?(reviewChoice===target?'good':'bad'):'hidden'}">${reviewChoice?(reviewChoice===target?'Correct!':'Correct answer: '+esc(target)):''}</div><div class="actions"><button class="secondary" id="reviewExit">← Levels</button><button class="primary" id="reviewAdvance" ${reviewChoice?'':'disabled'}>Next word →</button></div>`;
 bindAudio();$('reviewExit').onclick=()=>nav('levels');
 document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{
  if(reviewChoice)return;reviewChoice=opts[+b.dataset.review];const right=reviewChoice===target;
  if(right)reviewCorrect++;
  tapSound();if(!arabic)pronounceSelection(reviewChoice);
  feedbackAfterPronunciation(right);render();
 });
 $('reviewAdvance').onclick=()=>{if(!reviewChoice)return;reviewIndex++;reviewChoice='';render()};
 saveSession();
}
function celebratePanel(){
 const panel=$('panel');const el=panel.querySelector('.summary');if(!el)return;
 el.classList.add('celebrate');el.insertAdjacentHTML('afterbegin','<span class="medal" aria-hidden="true">🏆</span>');
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const colors=['#28b463','#f1c40f','#5dade2','#e67e22','#a569bd'];
 for(let k=0;k<36;k++){let sp=document.createElement('i');sp.className='sparkle';sp.style.left=(k*37%97)+'%';sp.style.top=-(k*19%80)+'px';sp.style.background=colors[k%colors.length];sp.style.animationDelay=(k%10)*.09+'s';el.appendChild(sp)}
}

function render(){saveSession();let l=lesson();if(finished){let newly=!state.completed[l.id];if(newly){state.completed[l.id]=true;state.xp+=earned;save();finishSound()}sidebar();$('panel').innerHTML=`<div class="summary"><div class="eyebrow">LESSON COMPLETE</div><h2>${esc(l.title)}</h2><div class="score">${correct}/${questions.length}</div><p>${newly?`+${earned} XP earned`:'Replay completed — XP preserved'}</p><p class="note">Your progress is saved automatically on this device.</p><div class="actions" style="justify-content:center"><button class="secondary" id="replay">Replay</button>${current<DATA.lessons.length-1?'<button class="primary" id="nextLesson">Next lesson →</button>':''}</div></div>`;celebratePanel();$('replay').onclick=()=>start(current);if($('nextLesson'))$('nextLesson').onclick=()=>start(current+1);return}
if(intro){$('panel').innerHTML=`<div class="intro"><div class="eyebrow">LESSON ${current%8+1} · ${questions.length===1&&questions[0].type==='unit-review'?questions[0].items.length:questions.length} QUESTIONS</div><h2>${esc(l.title)}</h2><p>${questions.length===1&&questions[0].type==='unit-review'?'Review every word from this unit. No new vocabulary — only practice.':'Start with familiar words, then practise short expressions and build longer sentences. Question types are mixed each time you replay.'}</p><p class="hint">🟨 New vocabulary is highlighted the first time it appears. Tap to reveal its meaning. Tap 🔊 to hear vocabulary. Listen & Build uses available recordings.</p><div class="vocab">${l.vocabulary.map(v=>`<span class="meaning" style="margin:2px;padding:8px">${esc(v.ar)} ${audioButton(v.ar)}<small style="display:block">${esc(v.meaning)}</small></span>`).join('')}</div><div class="actions"><button class="primary" id="begin">Start practice →</button><button class="secondary" id="openLevels">Browse lessons</button></div></div>`;bindAudio();$('begin').onclick=()=>{intro=false;render()};$('openLevels').onclick=()=>nav('levels');return}
let q=questions[idx];if(q.type==='unit-review'){renderReview(q);return}let tiles=q.type==='tiles'||q.type==='listen',listen=q.type==='listen',opts=tiles?q.options.map((v,i)=>({v,i})).filter(x=>!assembled.some(a=>a.i===x.i)):q.options.map((v,i)=>({v,i}));
$('panel').innerHTML=`<div class="row"><span class="qtype">LESSON ${current+1} · ${esc(l.title)}</span><span class="note">${idx+1} / ${questions.length}</span></div><div class="progress"><div class="fill" style="width:${idx/questions.length*100}%"></div></div><div class="qtype">${listen?'🎧 LISTEN & BUILD':tiles?'🧩 BUILD ARABIC':'VOCABULARY PRACTICE'}</div><div class="question">${listen?'Listen, then build the sentence':wordMarkup(q.prompt)}</div>${listen?`<div class="audioBox"><strong>🎧 Listen to the sentence</strong>${audioPath(q.audioText||q.answer)?audioButton(q.audioText||q.answer,'▶ Play / Replay audio'):'<div class="mini">No matching recording yet. You can still practise the word order.</div>'}<div class="mini" id="audioStatus" aria-live="polite"></div></div>`:''}<div id="meaningBox">${revealed}</div>${tiles?`<div class="answer" lang="ar" dir="rtl">${assembled.map((x,j)=>`<button type="button" data-remove="${j}">${esc(x.v)}</button>`).join('')||'<span class="note">Tap words in the correct order</span>'}</div>`:''}<div class="choices">${opts.map(x=>`<button type="button" class="opt ${!tiles&&selected===x.v?'selected':''} ${/[\u0600-\u06ff]/.test(x.v)?'arabic':''}" data-choice="${x.i}" ${checked?'disabled':''}>${esc(x.v)}</button>`).join('')}</div>${checked?`<div class="feedback ${selected===q.answer?'good':'bad'}"><strong>${selected===q.answer?'Correct! 🎉':'Not quite.'}</strong><br>${selected!==q.answer?'Correct answer: '+esc(q.answer)+'<br>':''}${esc(q.explanation)} ${audioButton(q.answer,'🔊 Hear answer')}</div>`:''}<div class="actions"><button type="button" class="secondary" id="restart">Restart lesson</button><button type="button" class="primary" id="action" ${!checked&&!selected?'disabled':''}>${checked?(idx===questions.length-1?'Finish lesson':'Continue →'):'Check answer'}</button></div>`;
bindWords();bindAudio();if(listen&&$('playAudio')&&q.audioSrc){$('playAudio').onclick=()=>{const a=new Audio(q.audioSrc);a.volume=0.55;$('audioStatus').textContent='Playing…';a.play().catch(()=>{$('audioStatus').textContent='Could not play recording. Check the file path.'});a.onended=()=>{$('audioStatus').textContent='Playback finished.'};a.onerror=()=>{$('audioStatus').textContent='Audio file missing or unreadable.'}}}$('restart').onclick=()=>start(current);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(checked)return;let i=+b.dataset.choice;if(tiles){assembled.push({v:q.options[i],i});selected=assembled.map(x=>x.v).join(' ')}else selected=q.options[i];tapSound();if(/[\u0600-\u06ff]/.test(q.options[i]))pronounceSelection(q.options[i]);render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(checked)return;assembled.splice(+b.dataset.remove,1);selected=assembled.map(x=>x.v).join(' ');render()});$('action').onclick=()=>{if(!checked){if(!selected)return;checked=true;if(selected===q.answer){correct++;earned+=10;feedbackAfterPronunciation(true)}else feedbackAfterPronunciation(false);render()}else{markEncountered(q);markEncountered(questions[idx]);idx++;checked=false;selected='';assembled=[];revealed='';reviewIndex=0;reviewCorrect=0;reviewChoice='';if(idx===questions.length)finished=true;render()}};
}
$('levelsTab').onclick=()=>nav('levels');$('practiceTab').onclick=()=>nav('practice');$('closePicker').onclick=()=>nav('practice');$('reset').onclick=()=>{if(confirm('Clear XP, completed lessons and vocabulary history?')){state={completed:{},xp:0,seen:{}};save();clearSession();start(0)}};$('exportProgress').onclick=exportProgress;$('importProgress').onclick=()=>$('importFile').click();$('importFile').onchange=e=>importProgress(e.target.files[0]);if(restoreSession()){sidebar();nav('practice');render()}else start(0);
</script>
<script id="android-action-dock-fix">
(function(){
  const panel=document.getElementById('panel');
  const area=document.getElementById('practiceArea');
  if(!panel||!area)return;
  const dock=document.createElement('div');
  dock.id='mobileActionDock';
  dock.setAttribute('role','group');
  dock.setAttribute('aria-label','Lesson controls');
  area.appendChild(dock);
  function syncDock(){
    const actions=panel.querySelector('.actions');
    if(actions){
      dock.replaceChildren(actions);
    }
  }
  new MutationObserver(syncDock).observe(panel,{childList:true});
  syncDock();
})();
</script>
